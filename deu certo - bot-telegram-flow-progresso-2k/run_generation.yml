name: Generate Images Google Flow (UI Automation)

concurrency:
  group: telegram-bot
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Prompt from Telegram (sobrescreve a lista)'
        required: false
        type: string
      chat_id:
        description: 'Chat ID of the Telegram user'
        required: false
        type: string
      message_id:
        description: 'Message ID da mensagem de status enviada'
        required: false
        type: string

jobs:
  run-automation:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Configure Google Session State
      env:
        AUTH_JSON: ${{ secrets.AUTH_SESSION_JSON }}
        GOOGLE_STATE: ${{ secrets.GOOGLE_SESSION_STATE }}
      run: |
        if [ -n "$AUTH_JSON" ]; then
          echo "$AUTH_JSON" > state.json
        elif [ -n "$GOOGLE_STATE" ]; then
          echo "$GOOGLE_STATE" | base64 -d > state.json
        else
          echo "Aviso: Nenhum segredo de sessao configurado!"
        fi
        echo "state.json configurado com $(wc -c < state.json) bytes"

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install system dependencies (Xvfb)
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install Playwright Browsers
      run: python -m playwright install --with-deps chromium

    - name: Run UI Automation on Google Flow
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ github.event.inputs.chat_id || secrets.TELEGRAM_CHAT_ID }}
        SINGLE_PROMPT: ${{ github.event.inputs.prompt }}
        MESSAGE_ID: ${{ github.event.inputs.message_id }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_REPO: ${{ github.repository }}
      run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python scripts/ui_automation.py

    - name: Upload Output (imagens e debug)
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: generated-images-flow
        path: output/
        if-no-files-found: warn
