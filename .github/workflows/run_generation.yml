name: Generate Images (UI Automation)

concurrency:
  group: telegram-bot
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Prompt from Telegram (sobrescreve a lista)'
        required: false
        type: string
      chat_id:
        description: 'Chat ID of the Telegram user'
        required: false
        type: string

jobs:
  run-automation:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip' # Faz cache do requirements.txt

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Store Playwright's Version
      id: playwright-version
      run: echo "version=$(pip show playwright | grep Version | cut -d' ' -f2)" >> $GITHUB_OUTPUT

    - name: Cache Playwright Browsers
      uses: actions/cache@v4
      id: playwright-cache
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

    - name: Install Playwright Browsers
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: python -m playwright install --with-deps chromium

    - name: Install xvfb (if needed)
      run: sudo apt-get install -y xvfb

    - name: Run UI Automation
      env:
        AUTH_SESSION_JSON: ${{ secrets.AUTH_SESSION_JSON }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ github.event.inputs.chat_id || secrets.TELEGRAM_CHAT_ID }}
        SINGLE_PROMPT: ${{ github.event.inputs.prompt }}
      run: |
        xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python scripts/ui_automation.py

    - name: Upload Output
      uses: actions/upload-artifact@v4
      with:
        name: generated-images
        path: output/
