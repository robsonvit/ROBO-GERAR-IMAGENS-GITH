name: Generate Images (UI Automation)

concurrency:
  group: telegram-bot
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Prompt from Telegram (sobrescreve a lista)'
        required: false
        type: string
      chat_id:
        description: 'Chat ID of the Telegram user'
        required: false
        type: string

jobs:
  run-automation:
    runs-on: self-hosted

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install Playwright Browsers
      run: python -m playwright install chromium

    - name: Run UI Automation
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ github.event.inputs.chat_id || secrets.TELEGRAM_CHAT_ID }}
        SINGLE_PROMPT: ${{ github.event.inputs.prompt }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_REPO: ${{ github.repository }}
      run: python scripts/ui_automation.py

    - name: Upload Output (imagens e debug)
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: generated-images
        path: output/
        if-no-files-found: warn
