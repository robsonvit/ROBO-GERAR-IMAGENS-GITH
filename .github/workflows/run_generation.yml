name: Generate Images (UI Automation)

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Prompt from Telegram (sobrescreve a lista)'
        required: false
        type: string
      chat_id:
        description: 'Chat ID of the Telegram user'
        required: false
        type: string

jobs:
  run-automation:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        python -m playwright install --with-deps
        sudo apt-get update
        sudo apt-get install -y xvfb

    - name: Run UI Automation
      env:
        AUTH_SESSION_JSON: ${{ secrets.AUTH_SESSION_JSON }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ github.event.inputs.chat_id || secrets.TELEGRAM_CHAT_ID }}
        SINGLE_PROMPT: ${{ github.event.inputs.prompt }}
      run: |
        xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python scripts/ui_automation.py

    - name: Upload Output
      uses: actions/upload-artifact@v4
      with:
        name: generated-images
        path: output/
