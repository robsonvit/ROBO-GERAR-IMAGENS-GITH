name: DuckDuckGo Generate Images (Automation)

concurrency:
  group: telegram-bot-duck
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Prompt from Telegram (para rodar script DuckDuckGo)'
        required: true
        type: string
      chat_id:
        description: 'Chat ID of the Telegram user'
        required: false
        type: string
      message_id:
        description: 'Message ID da mensagem de status enviada'
        required: false
        type: string

jobs:
  run-duck-automation:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: false

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Python dependencies
      run: pip install -r requirements.txt

    - name: Cache Playwright Browsers
      uses: actions/cache@v4
      id: playwright-cache
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          playwright-${{ runner.os }}-

    - name: Install Playwright Browsers
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: python -m playwright install chromium

    - name: Run DuckDuckGo UI Automation
      env:
        PYTHONUNBUFFERED: "1"
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ github.event.inputs.chat_id || secrets.TELEGRAM_CHAT_ID }}
        SINGLE_PROMPT: ${{ github.event.inputs.prompt }}
        MESSAGE_ID: ${{ github.event.inputs.message_id }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_REPO: ${{ github.repository }}
      run: python scripts/duck_automation.py

    - name: Upload Output (imagens e debug)
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: duck-generated-images
        path: output_duck/
        if-no-files-found: warn
